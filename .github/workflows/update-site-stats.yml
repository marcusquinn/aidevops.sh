name: Update site stats

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  update-site-stats:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate site stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_site_stats.py

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/data
          cp \
            404.html CNAME _headers docs.html index.html robots.txt script.js \
            site.webmanifest sitemap.xml styles.css favicon.svg favicon.ico \
            favicon-16x16.png favicon-32x32.png favicon-48x48.png \
            apple-touch-icon.png android-chrome-192x192.png \
            android-chrome-512x512.png og-image.svg og-image.png _site/
          cp data/aidevops-stats.json _site/data/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
