name: Check services sync

on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'

permissions:
  contents: read
  issues: write

jobs:
  check-services-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check site services against upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_services_sync.py
